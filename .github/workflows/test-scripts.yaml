name: Test archive scripts

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/test-scripts.yaml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The repo .Rprofile points at Posit's source URL, so skip it and set the
      # binary repo and the user agent it needs to serve Linux binaries.
      - name: Install test dependencies
        shell: Rscript --no-init-file {0}
        run: |
          options(
            warn = 2,
            repos = c(CRAN = Sys.getenv("RSPM")),
            HTTPUserAgent = sprintf(
              "R/%s R (%s)",
              getRversion(),
              paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])
            )
          )
          install.packages(c("testthat", "lubridate", "cli"))

      - name: Run tests
        run: Rscript --no-init-file -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
